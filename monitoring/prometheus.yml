# Prometheus 抓取配置：抓取 API 的 /metrics 端点
# 同 compose 网络内以服务名 api:8000 访问
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "commerce-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: ai-commerce-platform
